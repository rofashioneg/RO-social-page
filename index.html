<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11100f">
  <title>RÖ — The pRÖper fit</title>
  <style>
    * { 
      box-sizing: border-box; 
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #11100f;
      /* Prevents any accidental scrollbars */
      overflow: hidden; 
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .stage {
      position: relative;
      /* Wraps tightly around the image so percentage-based links stay perfectly aligned */
      display: inline-block; 
    }

    .backdrop {
      display: block;
      /* Prevents the image from being larger than the screen horizontally */
      max-width: 100vw;
      /* Prevents the image from being larger than the screen vertically */
      max-height: 100vh;
      width: auto;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Clickable Areas */
    .hit {
      position: absolute;
      left: 29.5%;
      width: 41%;
      height: 7.8%;
      z-index: 10;
      display: block;
      background: transparent;
      border-radius: 22px;
    }
    
    .instagram { top: 48.8%; }
    .tiktok { top: 58.5%; }
    .facebook { top: 68.2%; }
  </style>
</head>
<body>
  <main class="stage">
    <img class="backdrop" src="assets/ro-link-page.jpg" alt="RÖ — The pRÖper fit social page">
    <a class="hit instagram" href="https://www.instagram.com/rofashion.eg?igsh=MXQxdHU4bTA5YWNzcQ==" target="_blank" rel="noopener noreferrer" aria-label="Open RÖ Instagram"></a>
    <a class="hit tiktok" href="https://www.tiktok.com/@r.fashion43?_r=1&_t=ZS-98znHrXU1Fg" target="_blank" rel="noopener noreferrer" aria-label="Open RÖ TikTok"></a>
    <a class="hit facebook" href="https://www.facebook.com/share/1Bhj9QjNDV/" target="_blank" rel="noopener noreferrer" aria-label="Open RÖ Facebook"></a>
  </main>
</body>
</html>
